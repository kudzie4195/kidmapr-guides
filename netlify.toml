[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"

# Astro static output generates directory-based routing.
# Each page lives at /guides/[state]/[slug]/index.html.
# No SPA redirect needed — Netlify serves the index.html automatically.

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options         = "DENY"
    X-Content-Type-Options  = "nosniff"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Permissions-Policy      = "camera=(), microphone=(), geolocation=(self)"

# Long-cache for hashed assets
[[headers]]
  for = "/guides/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
